<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Cards Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <button id="toggleEdit">Редагувати</button>

  <div id="grid" class="grid">
    <!-- Картки -->
    <div class="card" draggable="false">JavaScript <span class="delete">×</span></div>
    <div class="card" draggable="false">Python <span class="delete">×</span></div>
    <div class="card" draggable="false">Java <span class="delete">×</span></div>
    <div class="card" draggable="false">TypeScript <span class="delete">×</span></div>
    <div class="card" draggable="false">Rust <span class="delete">×</span></div>
    <div class="card" draggable="false">Go <span class="delete">×</span></div>
    <div class="card" draggable="false">Kotlin <span class="delete">×</span></div>
    <div class="card" draggable="false">Swift <span class="delete">×</span></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
