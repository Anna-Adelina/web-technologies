<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="board">
  <div class="column" id="todo">
    <h2>To Do</h2>
    <div class="task" draggable="true">Item #1</div>
    <div class="task" draggable="true">Item #2</div>
    <div class="task" draggable="true">Item #3</div>
  </div>

  <div class="column" id="working">
    <h2>Working</h2>
    <div class="task" draggable="true">Item #4</div>
  </div>

  <div class="column" id="done">
    <h2>Done</h2>
    <div class="task" draggable="true">Item #5</div>
  </div>
</div>

<button id="shuffleBtn">Shuffle Tasks</button>

<script src="script.js"></script>
</body>
</html>
