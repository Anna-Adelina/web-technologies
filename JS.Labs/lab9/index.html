<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth & Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome для іконки ока -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="form-box">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('signup')">Signup</button>
            <button class="tab-btn" onclick="openTab('login')">Login</button>
        </div>

        <!-- Форма реєстрації -->
        <form id="signup-form" class="form-content active" novalidate>
            <h2>Create an account</h2>
            
            <div class="form-row">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" id="reg-firstname" placeholder="Mark">
                    <span class="error-msg"></span>
                </div>
                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" id="reg-lastname" placeholder="Otto">
                    <span class="error-msg"></span>
                </div>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="example@mail.com">
                <span class="error-msg"></span>
            </div>

            <div class="input-group">
                <label>Phone</label>
                <input type="text" id="reg-phone" placeholder="+380XXXXXXXXX">
                <span class="error-msg"></span>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Password</label>
                    <div class="pass-wrapper">
                        <input type="password" id="reg-password" placeholder="Enter password">
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <span class="error-msg"></span>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <div class="pass-wrapper">
                        <input type="password" id="reg-confirm" placeholder="Repeat password">
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <span class="error-msg"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Date Birth</label>
                    <input type="date" id="reg-dob">
                    <span class="error-msg"></span>
                </div>
                <div class="input-group">
                    <label>Sex</label>
                    <div class="radio-group" id="reg-sex">
                        <label class="radio-opt">
                            <input type="radio" name="reg-sex" value="male"> ♂ Male
                        </label>
                        <label class="radio-opt">
                            <input type="radio" name="reg-sex" value="female"> ♀ Female
                        </label>
                        <label class="radio-opt">
                            <input type="radio" name="reg-sex" value="other"> ⚥ Other
                        </label>
                    </div>
                    <span class="error-msg"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>Country</label>
                    <select id="reg-country">
                        <option value="">Choose country...</option>
                        <option value="ua">Ukraine</option>
                        <option value="de">Germany</option>
                        <option value="fr">France</option>
                        <option value="us">United States</option>
                        <option value="pl">Poland</option>
                        <option value="gb">United Kingdom</option>
                        <option value="ca">Canada</option>
                        <option value="it">Italy</option>
                        <option value="es">Spain</option>
                        <option value="nl">Netherlands</option>
                    </select>
                    <span class="error-msg"></span>
                </div>
                <div class="input-group">
                    <label>City</label>
                    <select id="reg-city" disabled>
                        <option value="">Choose city...</option>
                    </select>
                    <span class="error-msg"></span>
                </div>
            </div>

            <button type="submit" class="submit-btn">Signup</button>
        </form>

        <!-- Форма авторизації -->
        <form id="login-form" class="form-content">
            <h2>Login here</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="login-user" placeholder="Enter username">
                <span class="error-msg"></span>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="pass-wrapper">
                    <input type="password" id="login-pass" placeholder="Enter password">
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <span class="error-msg"></span>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="login-remember">
                <label for="login-remember">Remember Me</label>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
